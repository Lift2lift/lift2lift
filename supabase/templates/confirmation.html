<!DOCTYPE html>
<!--
  Kept deliberately plain so school mail filters (Microsoft 365 at colorado.edu)
  don't flag it as phishing: no images, no links, no hidden preview text,
  no school names, and no words like "password", "verify" or "account locked".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Lift2Lift code</title>
</head>
<body style="margin:0; padding:24px 16px; background-color:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#13213A;">
  <div style="max-width:520px;">
    <p style="margin:0 0 16px; font-size:16px; line-height:24px;">Hi,</p>
    <p style="margin:0 0 16px; font-size:16px; line-height:24px;">
      Thanks for signing up for Lift2Lift. Here is the code to finish signing up:
    </p>
    <p style="margin:0 0 16px; font-family:'SF Mono', Menlo, Consolas, 'Courier New', monospace; font-size:28px; line-height:36px; font-weight:700; letter-spacing:6px;">
      {{ .Token }}
    </p>
    <p style="margin:0 0 16px; font-size:16px; line-height:24px;">
      Type it into the Lift2Lift app. It works for 60 minutes.
    </p>
    <p style="margin:0 0 16px; font-size:14px; line-height:21px; color:#586A82;">
      If you didn't sign up, you can ignore this email.
    </p>
    <p style="margin:0; font-size:14px; line-height:21px; color:#586A82;">
      The Lift2Lift team
    </p>
  </div>
</body>
</html>
