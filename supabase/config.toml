# Local Supabase for Lift2Lift. `npm run db:start` reads this file.
# Hosted project: lift2lift (ref vpkxesucfaofwazqgpni). Link with `npm run db:link`.
project_id = "lift2lift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# License and insurance photos go in the private driver-docs bucket
# (created in migrations/…_cu_email_and_driver_verification.sql).
[storage]
enabled = true
file_size_limit = "10MiB"

# Local email inbox: every auth email (codes, resets) lands at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "lift2lift://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your Lift2Lift code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Lift2Lift password"
content_path = "./supabase/templates/recovery.html"

# Edge functions for the ID + selfie check (supabase/functions).
[edge_runtime]
enabled = true

[functions.identity-start]
verify_jwt = true

# Stripe calls this one; it checks the Stripe signature instead of a user token.
[functions.identity-webhook]
verify_jwt = false

# Called every minute by pg_cron with CRON_SECRET (see README), not by users.
[functions.send-ride-reminders]
verify_jwt = false

# Hosted project overrides, applied by `supabase config push`.
# Without these the hosted Site URL stays at localhost and email links land there.
[remotes.production]
project_id = "vpkxesucfaofwazqgpni"

[remotes.production.auth]
site_url = "https://lift2lift.vercel.app"
additional_redirect_urls = ["https://lift2lift.vercel.app", "lift2lift://"]
