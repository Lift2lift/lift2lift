# Local Supabase for Lift2Lift. `npm run db:start` reads this file.
# Hosted project: lift2lift (ref aqoqfsesceiykkoahnej). Link with `npm run db:link`.
project_id = "lift2lift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email inbox: every auth email (codes, resets) lands at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "lift2lift://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your Lift2Lift code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Lift2Lift password"
content_path = "./supabase/templates/recovery.html"
